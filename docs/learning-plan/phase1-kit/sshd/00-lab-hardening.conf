# lab-base01 SSH 強化設定
#
# [05 Phase 1 演習設計 3-8-1] で作成するファイルそのもの。
# https://github.com/ns7jp/ns7jp/blob/main/docs/learning-plan/05-phase1-exercise-design.md#3-8-パスワード認証root-ログインの禁止
#
# 配置先: /etc/ssh/sshd_config.d/00-lab-hardening.conf
#
# 重要（設計書の警告と同じ）:
#   - ファイル名は必ず "00-" で始めること。sshd_config.d 配下は辞書順に読まれ、
#     各キーワードは「最初に得た値」が勝つ（後勝ちの netplan とは逆）。
#     50-cloud-init.conf などインストーラ側のファイルより後ろの番号（例: 99-）にすると、
#     PasswordAuthentication no が黙って無視される。
#   - 必ず 3-7（鍵ログインの動作確認・key-login-ok スナップショット）を終えてから
#     このファイルを配置すること。先に置くと自分が締め出される。
#
# 配置後の確認手順（3-8-2〜3-8-5）:
#   sudo sshd -t
#   sudo systemctl reload ssh
#   systemctl is-active ssh
#   sudo sshd -T | grep -Ei '^(passwordauthentication|permitrootlogin|kbdinteractiveauthentication|loglevel)'
#
# 切り戻し（R-1）:
#   sudo rm /etc/ssh/sshd_config.d/00-lab-hardening.conf && sudo sshd -t && sudo systemctl reload ssh

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
LogLevel VERBOSE
